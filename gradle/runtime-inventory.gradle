import groovy.json.JsonOutput
import java.security.MessageDigest

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('writeRuntimeInventory') {
        doLast {
            def runtime = app.configurations.debugRuntimeClasspath
            def artifacts = runtime.resolvedConfiguration.resolvedArtifacts
            def components = artifacts.collect { artifact ->
                def id = artifact.moduleVersion.id
                def digest = MessageDigest.getInstance('SHA-256')
                artifact.file.withInputStream { stream ->
                    byte[] buffer = new byte[32768]
                    int count
                    while ((count = stream.read(buffer)) != -1) {
                        digest.update(buffer, 0, count)
                    }
                }
                def purl = "pkg:maven/${id.group}/${id.name}@${id.version}"
                [type: 'library', group: id.group, name: id.name, version: id.version,
                 'bom-ref': purl, purl: purl,
                 hashes: [[alg: 'SHA-256', content: digest.digest().encodeHex().toString()]]]
            }.unique { it['bom-ref'] }.sort { it['bom-ref'] }
            components += [
                [type: 'application', name: 'yt-dlp', version: '2026.10.26', 'bom-ref': 'bundled:yt-dlp',
                 hashes: [[alg: 'SHA-256', content: 'e51e69e89489f199530f13d32a4342da3ddb2cf34842f364603a066db05afbf3']]],
                [type: 'library', name: 'yt-dlp-ejs', version: '0.8.0', 'bom-ref': 'bundled:yt-dlp-ejs'],
                [type: 'framework', name: 'CPython', version: '3.12', 'bom-ref': 'bundled:cpython'],
                [type: 'library', name: 'QuickJS', 'bom-ref': 'bundled:quickjs'],
                [type: 'application', name: 'FFmpeg', 'bom-ref': 'bundled:ffmpeg']
            ]
            def destination = app.rootProject.file('docs/sbom.cdx.json')
            destination.parentFile.mkdirs()
            destination.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                bomFormat: 'CycloneDX', specVersion: '1.5', version: 1,
                metadata: [component: [type: 'application', name: 'SAOREO', version: '2.0.0',
                    'bom-ref': 'app:saoreo']],
                components: components
            ])) + '\n'
            println "Wrote ${components.size()} components to ${destination}"
        }
    }
}
